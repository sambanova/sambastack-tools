# Local infra ONLY (Postgres + MinIO). The api/worker/frontend can run either as
# native host processes (fast dev loop) or as containers (see docker-compose.yml).
# Bring up:  docker compose -f deploy/local/docker-compose.infra.yml up -d
name: sambaeval-local

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sambaeval
      POSTGRES_PASSWORD: sambaeval
      POSTGRES_DB: sambaeval
    ports:
      - "5433:5432"          # 5433 on host to avoid clashing with any local pg
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sambaeval -d sambaeval"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sambaeval
      MINIO_ROOT_PASSWORD: sambaeval-secret
    ports:
      - "9100:9000"          # S3 API (host 9100; 9000 taken by langfuse clickhouse)
      - "9101:9001"          # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Creates the sambaeval bucket once MinIO is healthy, then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 sambaeval sambaeval-secret &&
      mc mb --ignore-existing local/sambaeval &&
      mc anonymous set none local/sambaeval &&
      echo 'bucket ready';
      "

volumes:
  pgdata: {}
  miniodata: {}
