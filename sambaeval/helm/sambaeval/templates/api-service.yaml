apiVersion: v1
kind: Service
metadata:
  name: {{ include "sambaeval.fullname" . }}-api
  labels:
    {{- include "sambaeval.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    {{- include "sambaeval.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
