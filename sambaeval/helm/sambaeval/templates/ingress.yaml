{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "sambaeval.fullname" . }}
  labels:
    {{- include "sambaeval.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      # Supplied by the host cluster (prodplan §6b) — no cert-manager.
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          # API first (more specific prefix), then the frontend catch-all.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "sambaeval.fullname" . }}-api
                port:
                  number: {{ .Values.api.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "sambaeval.fullname" . }}-frontend
                port:
                  number: {{ .Values.frontend.port }}
{{- end }}
