apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sambaeval.fullname" . }}-api
  labels:
    {{- include "sambaeval.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.hpa.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  strategy:
    {{- toYaml .Values.api.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "sambaeval.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sambaeval.selectorLabels" (dict "root" . "component" "api") | nindent 8 }}
      annotations:
        # Roll pods when the env ConfigMap changes (samba-chat pattern).
        checksum/config: {{ include (print $.Template.BasePath "/configmap-env.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "sambaeval.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: api
          image: {{ include "sambaeval.backendImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sambaeval-server", "--host", "0.0.0.0", "--port", "{{ .Values.api.port }}"]
          envFrom:
            - configMapRef:
                name: {{ include "sambaeval.configMapName" . }}
            - secretRef:
                name: {{ .Values.secretName }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          readinessProbe:
            httpGet: { path: /api/app-version, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/app-version, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
