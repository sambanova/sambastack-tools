[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sambaeval"
version = "0.1.0"
description = "SambaEval evaluation engine — library + CLI (Python core)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "httpx>=0.27",
    # Output-generator deps (previously scripts/requirements.txt). Generators
    # now run in-process, so they share this environment.
    "openai>=1.0.0",
    # LangChain-agent example generator
    # (scripts/generators/langchain_agent_generator.py).
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "numpy>=2.4.6",
    "scipy>=1.17.1",
    "sympy>=1.14.0",
    "h5py>=3.16.0",
    "llm-sandbox[podman]>=0.3.39",
]

[project.optional-dependencies]
# Phase 1 (FastAPI backend). Installed when we get there.
server = ["fastapi>=0.110", "uvicorn>=0.29"]
# Test suite (pytest). Installed in CI and for local `pytest backend/tests`.
# Pulls in the server extra too: the API-level tests (test_error_log,
# test_orphan_cancel, test_retry_config) drive the FastAPI app via TestClient.
test = ["pytest>=8", "sambaeval[server]"]

[project.scripts]
sambaeval = "sambaeval.cli:main"
sambaeval-server = "sambaeval.api:serve"

[tool.setuptools.packages.find]
where = ["."]
include = ["sambaeval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
