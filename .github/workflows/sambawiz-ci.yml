name: SambaWiz CI

# NOTE: no top-level `paths:` filter. A path-filtered workflow does not trigger
# at all when the paths don't match, so a required status check pointing at it
# is never reported and blocks the merge forever ("Expected — waiting for status
# to be reported"). Instead we always trigger, detect changes inside, skip the
# real job when sambawiz/** is untouched, and let the always-running gate job
# report the required status.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      sambawiz: ${{ steps.filter.outputs.sambawiz }}
    steps:
    - uses: actions/checkout@v4
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          sambawiz:
            - 'sambawiz/**'
            - '.github/workflows/sambawiz-ci.yml'

  sambawiz-lint-and-test:
    needs: changes
    if: ${{ needs.changes.outputs.sambawiz == 'true' }}
    runs-on: ubuntu-latest
    # Fail fast instead of running until the 6-hour GitHub default if a step
    # ever hangs (e.g. a resource-starved test runner) — a hung job then shows
    # up as a red timeout rather than "never completes".
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: sambawiz/package-lock.json

    - name: Install dependencies
      run: npm ci --prefix sambawiz

    # Run Jest in CI mode with a bounded worker count. The default worker count
    # (cores - 1) combined with ts-jest's per-worker type-checking can exhaust
    # memory on the 2-core GitHub runner, making the job thrash and appear to
    # hang. `--ci` disables the interactive watch/prompt paths and `--forceExit`
    # guarantees the process exits even if a stray async handle lingers.
    - name: Run tests
      run: npm test --prefix sambawiz -- --ci --maxWorkers=2 --forceExit

    - name: Run linter
      run: npm run lint --prefix sambawiz

  # Always-running aggregate gate. THIS is the job to mark as a required status
  # check in the ruleset (context: "sambawiz-ci-gate"), not the path-skipped
  # job above. It passes when the real job succeeded or was skipped, and fails
  # only when the real job actually failed or was cancelled.
  sambawiz-ci-gate:
    needs: [ sambawiz-lint-and-test ]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
    - name: Check result
      run: |
        result="${{ needs.sambawiz-lint-and-test.result }}"
        echo "sambawiz-lint-and-test result: $result"
        if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
          exit 1
        fi
