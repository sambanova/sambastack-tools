name: SambaEval CI

# See sambawiz-ci.yml for why there is no top-level `paths:` filter: a required
# status check on a path-filtered workflow never reports when the paths don't
# match and blocks the merge. We filter inside and gate with an always-running
# job instead.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      sambaeval: ${{ steps.filter.outputs.sambaeval }}
    steps:
    - uses: actions/checkout@v4
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          sambaeval:
            - 'sambaeval/**'
            - '.github/workflows/sambaeval-ci.yml'

  backend-tests:
    needs: changes
    if: ${{ needs.changes.outputs.sambaeval == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sambaeval/backend

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.13

    - name: Install dependencies
      run: uv sync --extra test

    - name: Run backend tests
      run: uv run python -m pytest tests/ -v

  # Always-running aggregate gate — mark "sambaeval-ci-gate" as the required
  # status check, not "backend-tests". Passes when backend-tests succeeded or
  # was skipped; fails only on real failure/cancellation.
  sambaeval-ci-gate:
    needs: [ backend-tests ]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
    - name: Check result
      run: |
        result="${{ needs.backend-tests.result }}"
        echo "backend-tests result: $result"
        if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
          exit 1
        fi
