name: SambaEval CI

on:
  push:
    branches: [ main ]
    paths:
      - 'sambaeval/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'sambaeval/**'

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sambaeval/backend

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.13

    - name: Install dependencies
      run: uv sync --extra test

    - name: Run backend tests
      run: uv run python -m pytest tests/ -v
